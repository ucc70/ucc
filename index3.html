<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background-color: #182c49;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    img {
      display: block;
      /* En pantallas grandes se ve a tamaño original (640 px);
         en pantallas chicas se achica para entrar completo. */
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <img src="logoblanco.png" alt="Logo">
</body>
</html>
