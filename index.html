<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c6d1ed">
<title>UCC 70 años · Tu palabra</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--fondo:#c6d1ed;--azul:#002f87}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--fondo);color:var(--azul);font-family:Montserrat,Arial,sans-serif}
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:5dvh 8vw}
.screen[hidden]{display:none}
h1,h2{margin:0;font-weight:600;font-size:clamp(21px,6.2vw,32px);line-height:1.6;text-align:center;text-wrap:balance}

/* Pantalla 1: formulario */
#form{justify-content:center;padding-bottom:9dvh}
.fields{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center}
h1{margin-bottom:5dvh}
input{width:100%;font:600 19px Montserrat,Arial,sans-serif;color:var(--azul);background:#fff;border:3px solid var(--azul);border-radius:22px;padding:14px 18px;outline:none;margin-bottom:14px;text-align:left}
input:focus{box-shadow:0 0 0 4px rgba(0,47,135,.2)}
input::placeholder{font-family:Montserrat,Arial,sans-serif;font-weight:500;font-size:16px;color:#a3a9b5;opacity:1;text-transform:none;letter-spacing:0}
#palabra{text-transform:uppercase}
.hint{min-height:22px;width:100%;font-size:14px;font-weight:500;color:#c0233f;margin:0 0 4px;text-align:center;opacity:0;transition:opacity .25s}
.hint.show{opacity:1}
button{margin-top:6px;min-width:55%;font:700 19px Montserrat,Arial,sans-serif;color:#fff;background:var(--azul);border:0;border-radius:22px;padding:14px 36px;cursor:pointer;transition:transform .15s,opacity .2s}
button:active{transform:scale(.97)}
button:disabled{opacity:.7}

/* Pantalla 2: gracias + logo */
#gracias{padding-top:24dvh;padding-bottom:5dvh}
.logo{margin-top:auto;display:block;width:auto;max-width:100%;height:auto;filter:url(#tinte)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<!-- tiñe el logo (blanco con transparencia) del azul #002f87 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="tinte" color-interpolation-filters="sRGB"><feFlood flood-color="#002f87"/><feComposite in2="SourceAlpha" operator="in"/></filter></svg>

<main id="form" class="screen">
  <div class="fields">
    <h1>En una palabra<br>¿Qué sigue siendo UCC en vos hoy?</h1>
    <input id="nombre" type="text" autocomplete="given-name" maxlength="60" placeholder="Tu nombre (opcional)">
    <input id="palabra" type="text" maxlength="30" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="Tu palabra">
    <div class="hint" id="hint" role="alert"></div>
    <button id="enviar">Enviar</button>
  </div>
</main>

<section id="gracias" class="screen" hidden>
  <h2>Gracias por<br>participar</h2>
  <img class="logo" src="logoblanco.png" alt="Universidad Católica de Córdoba · 70 años" onerror="this.style.display='none'">
</section>

<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const pal=$('palabra'),nom=$('nombre'),hint=$('hint'),btn=$('enviar');
function msg(t){hint.textContent=t;hint.classList.toggle('show',!!t)}
pal.addEventListener('input',()=>{
  let v=pal.value.replace(/^\s+/,'');
  if(/\s\S/.test(v)){v=v.split(/\s+/)[0];msg('Escribí una sola palabra, sin espacios.')}else msg('');
  pal.value=v.toLocaleUpperCase('es').replace(/[^\p{L}\p{N}\-]/gu,'');
});
nom.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();pal.focus()}});
pal.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();btn.click()}});
btn.addEventListener('click',async()=>{
  const n=nom.value.trim(),w=pal.value.trim();
  if(!w){msg('Escribí tu palabra, por favor.');pal.focus();return}
  if(CONFIG.SCRIPT_URL.includes('PEGAR')){msg('Falta configurar config.js');return}
  btn.disabled=true;btn.textContent='Enviando…';msg('');
  try{
    await fetch(CONFIG.SCRIPT_URL,{method:'POST',mode:'no-cors',body:new URLSearchParams({nombre:n,palabra:w})});
    $('form').hidden=true;$('gracias').hidden=false;window.scrollTo(0,0);
  }catch(e){
    msg('No pudimos enviarla. Revisá tu conexión e intentá de nuevo.');
    btn.disabled=false;btn.textContent='Enviar';
  }
});
</script>
</body>
</html>
