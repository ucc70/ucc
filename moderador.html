<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c6d1ed">
<meta name="robots" content="noindex">
<title>UCC · Moderador</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--fondo:#c6d1ed;--azul:#002f87;--ok:#1f9d55;--no:#d64045}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--fondo);color:var(--azul);font-family:Montserrat,Arial,sans-serif;touch-action:manipulation}
header{position:sticky;top:0;z-index:5;background:var(--fondo);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:15px}
#st{display:flex;align-items:center;gap:7px;font-weight:500;font-size:12px;opacity:.8}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.dot.send{background:#e0a100}.dot.off{background:var(--no)}
#list{max-width:420px;margin:0 auto;padding:2px 12px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.card{background:#fff;border:2px solid var(--azul);border-radius:16px;padding:9px 10px 10px;animation:in .2s ease both}
.card.out{overflow:hidden;pointer-events:none;animation:out .18s ease forwards}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes out{from{max-height:140px;opacity:1}to{max-height:0;opacity:0;padding-top:0;padding-bottom:0;margin-bottom:-8px;border-width:0}}
.w{font-weight:800;font-size:22px;line-height:1.15;text-transform:uppercase;text-align:center;overflow-wrap:anywhere}
.n{text-align:center;font-weight:500;font-size:12px;color:#7b86a3;margin-top:1px}
.btns{display:flex;gap:8px;margin-top:8px}
.btns button{flex:1;height:44px;border:0;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.btns button:active{filter:brightness(.85)}
.ok{background:var(--ok)}.no{background:var(--no)}
.btns svg{width:24px;height:24px;stroke:#fff;stroke-width:4.5;fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#empty{text-align:center;padding:16dvh 8vw 0;font-weight:600;font-size:16px;opacity:.7}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header><span id="cnt">0 pendientes</span><span id="st"><span class="dot" id="dot"></span><span id="stt"></span></span></header>
<div id="list"></div>
<div id="empty" hidden>No hay palabras pendientes</div>

<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const POLL=2000;
const OK='<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>';
const NO='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const cards=new Map(),done=new Set(),queue=[];
let sending=false,loaded=false,offline=false,first=true;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function api(params){
  const q=new URLSearchParams({...params,t:Date.now()});
  const r=await fetch(CONFIG.SCRIPT_URL+'?'+q,{cache:'no-store'});
  return r.json();
}
function status(){
  const bad=offline,busy=queue.length>0;
  $('dot').className='dot'+(bad?' off':busy?' send':'');
  $('stt').textContent=bad?'Sin conexión':busy?'Enviando…':'';
}
function count(){
  const n=[...cards.values()].filter(c=>!c.classList.contains('out')).length;
  $('cnt').textContent=`${n} ${n===1?'pendiente':'pendientes'}`;
  $('empty').hidden=!(loaded&&n===0);
}

/* Aprobar / rechazar: la tarjeta sale al instante y el envío va en segundo plano */
function decide(id,w,a,card){
  if(done.has(id))return;
  done.add(id);queue.push([id,w,a]);
  card.classList.add('out');
  setTimeout(()=>{card.remove();cards.delete(id);count()},190);
  count();status();flush();
}
async function flush(){
  if(sending)return;sending=true;
  while(queue.length){
    const batch=queue.slice(0,30);
    try{
      const d=await api({action:'decide',items:JSON.stringify(batch)});
      if(!d.ok)throw 0;
      queue.splice(0,batch.length);offline=false;status();
    }catch(e){offline=true;status();await sleep(1500)}   // reintenta solo, sin perder nada
  }
  sending=false;
}

function makeCard(it){
  const c=document.createElement('div');c.className='card';
  const w=document.createElement('div');w.className='w';w.textContent=it.w;
  c.append(w);
  if(it.n){const n=document.createElement('div');n.className='n';n.textContent=it.n;c.append(n)}
  const b=document.createElement('div');b.className='btns';
  const ok=document.createElement('button');ok.className='ok';ok.innerHTML=OK;ok.setAttribute('aria-label','Aprobar');
  const no=document.createElement('button');no.className='no';no.innerHTML=NO;no.setAttribute('aria-label','Rechazar');
  ok.onclick=()=>decide(it.id,it.w,'a',c);
  no.onclick=()=>decide(it.id,it.w,'r',c);
  b.append(ok,no);c.append(b);
  return c;
}
function sync(list){
  const ids=new Set(list.map(x=>x.id));
  cards.forEach((c,id)=>{if(!ids.has(id)&&!c.classList.contains('out')){c.remove();cards.delete(id)}});
  let added=0;
  list.forEach(it=>{                       // los nuevos siempre se agregan ABAJO
    if(cards.has(it.id)||done.has(it.id))return;
    const c=makeCard(it);cards.set(it.id,c);$('list').appendChild(c);added++;
  });
  if(added&&!first&&navigator.vibrate)navigator.vibrate(50);
  first=false;loaded=true;count();
}
async function poll(){
  try{
    const d=await api({action:'pending'});
    if(!d.ok)throw 0;
    offline=false;sync(d.pending||[]);status();
  }catch(e){offline=true;status()}
  setTimeout(poll,POLL);
}
if(CONFIG.SCRIPT_URL.includes('PEGAR')){$('cnt').textContent='Falta configurar config.js'}
else poll();
</script>
</body>
</html>
